<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DocQuery — Ask your document</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="wrap header-inner">
      <a href="index.html" class="logo">DocQuery</a>
      <div class="app-header-right">
        <span class="status-pill" id="account-pill"></span>
        <button type="button" class="btn btn-ghost btn-sm" id="logout-btn">Log out</button>
      </div>
    </div>
  </header>

  <main>
    <section class="demo" id="demo" style="padding-top: var(--space-6);">
      <div class="wrap">
        <div class="demo-grid">

          <div class="panel panel-topics">
            <div class="panel-header">
              <span class="panel-eyebrow">Document</span>
              <h3>Upload a PDF</h3>
            </div>

            <div class="dropzone" id="dropzone">
              <input type="file" id="file-input" accept="application/pdf" hidden />
              <p class="dropzone-text" id="dropzone-text">Tap to choose a PDF, or drag one in</p>
              <p class="dropzone-file" id="dropzone-filename"></p>
            </div>

            <div class="upload-status" id="upload-status" hidden></div>
          </div>

          <div class="panel panel-chat">
            <div class="panel-header">
              <span class="panel-eyebrow">Assistant</span>
              <h3>Ask a question</h3>
              <span class="status-pill" id="chat-status">Waiting for a document</span>
            </div>

            <div class="chat-log" id="chat-log">
              <div class="chat-empty" id="chat-empty">
                Upload a PDF above, then ask something like "What does this document conclude?"
              </div>
            </div>

            <form class="chat-input-row" id="chat-form">
              <input
                type="text"
                id="chat-input"
                class="chat-input"
                placeholder="Ask about your document…"
                autocomplete="off"
                disabled
              />
              <button type="submit" class="chat-send" id="chat-send" disabled aria-label="Send">
                <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M2 10L17 2L11 17L8.5 11.5L2 10Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
              </button>
            </form>
          </div>

        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
